# Recipe: MiniMax-M3-W4A16-GPTQ + KVarN k4v2 (dense+draft) — Phase 1, stock Triton sparse
# BF16 main-KV baseline variant of minimax-m3-w4a16-gptq-b12x.yaml.
#
# Identical to the fp8 recipe except kv_cache_dtype=auto (bf16 main KV, no
# quantization on the KV write/read path; b12x kernels take the bf16 route,
# use_fp8_kv=False, no descale). The indexer side cache REMAINS the b12x packed
# page-64 fp8 layout (132 B/token) -- the b12x indexer glue supports fp8 or
# nvfp4 packed caches only; a bf16 indexer cache is the stock Triton path, not
# a b12x path. bf16 KV halves KV capacity vs fp8 (~2 GiB extra @65536); fits
# comfortably at 0.93 on GB10.
#
# Purpose: decode-throughput baseline matrix (bf16 vs fp8 vs nvfp4 main KV)
# for the b12x decode optimization work. See
# docs/b12x-decode-optimization-sequencing-plan.md Phase 0.

recipe_version: "1"
name: MiniMax-M3-W4A16-GPTQ-b12x-bf16kv
description: MiniMax-M3 GPTQ W4A16 TP2 with KVarN k4v2_g128 KV quant on dense layers (PR 46812 backport); sparse MSA layers bf16 via stock Triton impl (Phase 1)

model: Sebesky/MiniMax-M3-W4A16-GPTQ
container: vllm-node-minimax-m3-b12x

build_args:
  - --vllm-ref
  - 979b56a66c969ab67655d2155ab4c6c5bed15f65
  - --apply-vllm-patch
  - minimax-m3-fused-fp8-kv.patch
  - --build-rust

cluster_only: true
mods:
  # Stock (non-b12x) M3 stack + KVarN (PR #46812 backport). Phase 1:
  # dense + draft layers on KVarN, sparse MSA layers bf16 (Phase 2 = kvarn
  # tiles for sparse). See docs/b12x-kvarn-integration-plan.md.
  - mods/fix-prometheus-fastapi-routing
  - mods/fix-minimax-m3-reasoning-parser-robustness
  - mods/fix-minimax-m3-compressed-tensors-swiglu-clamp
  - mods/fix-minimax-m3-indexer-proj-bf16-load
  - mods/add-kvarn-kv-quant
  - mods/fix-minimax-m3-kvarn-hybrid

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.93
  max_model_len: 65536
  max_num_batched_tokens: 2048
  max_num_seqs: 1
  block_size: 128
  # auto = model dtype (bf16) main KV; b12x paged kernels use the bf16 path.
  kv_cache_dtype: kvarn_k4v2_g128
  load_format: instanttensor

env:
  # KVarN fp16 tail pool: default budget is 0.5x post-weight usable memory,
  # sized for dense-model concurrency. M3 has only 3 kvarn layers and
  # max_num_seqs=1 -> structural need is ~tens of MB. 1% is generous.
  KVARN_POOL_MEM_FRAC: "0.01"
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"
  OMP_NUM_THREADS: "20"
  MKL_NUM_THREADS: "20"
  OPENBLAS_NUM_THREADS: "20"
  NUMEXPR_NUM_THREADS: "20"
  VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
  HF_TOKEN: $HF_TOKEN
  # Unused on the bf16 main-KV path (no fp8 round-trip); kept for mod parity.
  VLLM_M3_FP8_KV_TEST_SCALE: "1.0"

command: |
  vllm serve Sebesky/MiniMax-M3-W4A16-GPTQ \
      --trust-remote-code \
      --port {port} \
      --host {host} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      -tp {tensor_parallel} \
      --distributed-executor-backend mp \
      --block-size {block_size} \
      --kv-cache-dtype {kv_cache_dtype} \
      --compilation-config '{{"mode": 0, "cudagraph_mode": "FULL_DECODE_ONLY", "cudagraph_copy_inputs": true}}' \
      --default-chat-template-kwargs '{{"thinking_mode":"enabled"}}' \
      --max-model-len {max_model_len} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --max-num-seqs {max_num_seqs} \
      --language-model-only \
      --load-format {load_format} \
      --reasoning-parser minimax_m3 \
      --enable-auto-tool-choice \
      --tool-call-parser minimax_m3
