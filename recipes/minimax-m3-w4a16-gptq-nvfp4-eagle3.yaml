# Recipe: MiniMax-M3-W4A16 (GPTQ) — NVFP4 target KV + EAGLE3 spec decode  [STAGE 2]
#
# Combines the full nvfp4 main-KV stack (sparse layers nvfp4, dense layers fp8,
# indexer nvfp4, fused write kernel) with EAGLE3 speculative decoding using the
# self-contained RTN-int4 drafter (eagle-bf16-rtn-int4: keeps its OWN int4
# embed+lm_head -> NOT shared with the target; that sharing was the 0%-accept bug).
#
# KV SPLIT:
#   * TARGET: nvfp4 main KV (57 sparse layers) + fp8 dense KV (3 layers) + nvfp4
#     indexer side-cache. ~4x smaller than bf16 -> long context.
#   * DRAFT : fp8_e4m3 KV. The draft is plain-Llama attention on TRITON_ATTN, which
#     has no nvfp4 kernels (nvfp4 is MiniMax-M3-only, and trtllm-gen FP4 FMHA is
#     sm100-gated). The fix-eagle3-draft-kv-fp8 mod pins the draft cache_dtype to
#     fp8 in the proposer's separate draft VllmConfig (its own KV-cache group).
#
# EAGLE3 mods (see the fp8 eagle3 recipe for the root-cause writeup):
#   * fix-eagle3-draft-embed-quant : draft embed gets the draft quant_config (so its
#     int4 embed loads) + hasattr-guards the embed-share compare against a compressed
#     target (else AttributeError on target_embed_tokens.weight).
#   * fix-eagle3-draft-kv-fp8       : draft KV -> fp8 under the nvfp4 global (above).

recipe_version: "1"
name: MiniMax-M3-W4A16-GPTQ-NVFP4-EAGLE3
description: MiniMax-M3 GPTQ W4A16, nvfp4 target KV + fp8 draft KV, EAGLE3 RTN-int4 drafter, dual Spark/GB10 TP2

model: Sebesky/MiniMax-M3-W4A16-GPTQ
container: vllm-node-minimax-m3

build_args:
  - --vllm-ref
  - 979b56a66c969ab67655d2155ab4c6c5bed15f65
  - --apply-vllm-patch
  - minimax-m3-fused-fp8-kv.patch
  - --build-rust

cluster_only: true
mods:
  - mods/fix-prometheus-fastapi-routing
  - mods/fix-minimax-m3-reasoning-parser-robustness
  - mods/fix-minimax-m3-fp8-kv-scales-read
  - mods/fix-minimax-m3-fp8-kv-scales-write
  - mods/fix-minimax-m3-indexer-fp8-read
  - mods/fix-minimax-m3-indexer-fp8-write
  - mods/fix-minimax-m3-compressed-tensors-swiglu-clamp
  - mods/fix-minimax-m3-indexer-proj-bf16-load
  - mods/fix-minimax-m3-indexer-nvfp4
  - mods/fix-minimax-m3-main-kv-nvfp4
  - mods/fix-minimax-m3-dense-attn-fp8
  - mods/fix-minimax-m3-nvfp4-write-kernel
  # --- EAGLE3 spec-decode enablers ---
  - mods/fix-eagle3-draft-embed-quant
  - mods/fix-eagle3-draft-kv-fp8
  - mods/debug-minimax-m3-activations
  - mods/debug-minimax-m3-eagle3

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  draft_tensor_parallel: 2
  spec_tokens: 3
  gpu_memory_utilization: 0.935
  # Aspirational: nvfp4 target alone reached ~182k; the int4 drafter (~1.7GB) +
  # fp8 draft KV eat into that, so 196608 may be above the fit -> vLLM will report
  # the achievable max (graceful ValueError, not OOM) and we trim if needed.
  max_model_len: 131072
  max_num_batched_tokens: 2048
  max_num_seqs: 1
  block_size: 128
  kv_cache_dtype: fp8_e4m3
  attention_backend: TRITON_ATTN
  load_format: instanttensor

env:
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"
  OMP_NUM_THREADS: "20"
  MKL_NUM_THREADS: "20"
  OPENBLAS_NUM_THREADS: "20"
  NUMEXPR_NUM_THREADS: "20"
  VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
  HF_TOKEN: $HF_TOKEN
  # nvfp4 main/indexer use dynamic per-block e4m3 scales; this test scale only
  # affects the fp8 DENSE (3 layers) + fp8 DRAFT KV roundtrip (write/2, read*2).
  VLLM_M3_FP8_KV_TEST_SCALE: "2.0"
  VLLM_M3_DEBUG_ACT: "0"
  VLLM_M3_EAGLE_DBG: "0"
  VLLM_M3_EAGLE_DBG_STEPS: "12"

command: |
  vllm serve Sebesky/MiniMax-M3-W4A16-GPTQ \
      --trust-remote-code \
      --port {port} \
      --host {host} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      -tp {tensor_parallel} \
      --distributed-executor-backend mp \
      --block-size {block_size} \
      --kv-cache-dtype {kv_cache_dtype} \
      --attention-backend {attention_backend} \
      --attention-config '{{"indexer_kv_dtype": "fp8"}}' \
      --speculative-config '{{"method":"eagle3","model":"/root/.cache/huggingface/hub/eagle-bf16-rtn-int4","draft_tensor_parallel_size":{draft_tensor_parallel},"num_speculative_tokens":{spec_tokens},"attention_backend":"TRITON_ATTN"}}' \
      --default-chat-template-kwargs '{{"thinking_mode":"enabled"}}' \
      --max-model-len {max_model_len} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --max-num-seqs {max_num_seqs} \
      --language-model-only \
      --load-format {load_format} \
      --reasoning-parser minimax_m3 \
      --enable-auto-tool-choice \
      --tool-call-parser minimax_m3
