# Recipe: MiniMax-M3-W4A16 compressed-tensors
#
# Serves Sebesky/MiniMax-M3-W4A16, the AutoRound W4A16 compressed-tensors
# checkpoint. This supersedes the older bullerwins AutoGPTQ/INC-style RTN
# recipe. Important differences:
#   * Do NOT use --quantization auto_gptq/gptq. vLLM auto-detects
#     quant_method="compressed-tensors" from config.json.
#   * Do NOT use the old AutoGPTQ symmetric qzero/MoE patch.
#   * Keep the MiniMax-M3 source build/patches, FP8 KV/indexer patches, and the
#     calibrated scale loader for m3_fp8_cache_scales.json.
#   * The pinned vLLM ref has compressed-tensors WNA16 linear/MoE support and
#     packed embedding lookup support (CompressedTensorsEmbeddingWNA16Int).
#
# MSA requires --block-size 128. Keep --language-model-only for text serving.

recipe_version: "1"
name: MiniMax-M3-W4A16-compressed-tensors-bf16-cache
description: MiniMax-M3 AutoRound W4A16 compressed-tensors BF16/auto KV+indexer control serving recipe

model: Sebesky/MiniMax-M3-W4A16
container: vllm-node-minimax-m3

build_args:
  # Known-good vLLM commit with MiniMax-M3 support and compressed-tensors packed
  # embedding support. The local FP8-KV source patch still applies against it.
  - --vllm-ref
  - 979b56a66c969ab67655d2155ab4c6c5bed15f65
  - --apply-vllm-patch
  - minimax-m3-fused-fp8-kv.patch
  - --build-rust

cluster_only: true
mods:
  - mods/fix-prometheus-fastapi-routing
  - mods/fix-minimax-m3-reasoning-parser-robustness
  - mods/fix-minimax-m3-compressed-tensors-swiglu-clamp

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.93
  max_model_len: 16384
  max_num_batched_tokens: 2048
  max_num_seqs: 1
  block_size: 128
  kv_cache_dtype: auto
  attention_backend: TRITON_ATTN
  load_format: instanttensor

# Compressed-tensors is selected from the model config; no --quantization flag is
# needed. If startup ever fails to auto-detect, try appending:
#   --quantization compressed-tensors
# but keep that out of the default recipe so the checkpoint remains the source of truth.
env:
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"
  # Real calibrated sidecar in the model repo. The scale-loader mod will hit the
  # local HF cache after --setup; VLLM_M3_FP8_CACHE_SCALES can override with a path.
  VLLM_M3_FP8_CACHE_SCALES_REPO: "Sebesky/MiniMax-M3-W4A16"
  # Leave test-scale neutral. The scale-loader mod overwrites sparse-layer scales
  # from m3_fp8_cache_scales.json. Set to 2.0 only for read/write roundtrip tests.
  VLLM_M3_FP8_KV_TEST_SCALE: "1.0"

command: |
  vllm serve Sebesky/MiniMax-M3-W4A16 \
      --trust-remote-code \
      --port {port} \
      --host {host} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      -tp {tensor_parallel} \
      --distributed-executor-backend mp \
      --block-size {block_size} \
      --kv-cache-dtype {kv_cache_dtype} \
      --attention-backend {attention_backend} \
      --compilation-config '{{"mode": 0, "cudagraph_mode": "FULL_DECODE_ONLY"}}' \
      --default-chat-template-kwargs '{{"thinking_mode":"enabled"}}' \
      --max-model-len {max_model_len} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --max-num-seqs {max_num_seqs} \
      --language-model-only \
      --load-format {load_format} \
      --reasoning-parser minimax_m3 \
      --enable-auto-tool-choice \
      --tool-call-parser minimax_m3
