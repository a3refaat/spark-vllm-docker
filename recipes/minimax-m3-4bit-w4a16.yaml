# Recipe: MiniMax-M3-4bit-W4A16-v0
# Experimental low-memory text-only launch for a dual DGX Spark / GB10 cluster.
# MiniMax-M3 support currently lives in upstream vLLM PR #45381.
# build-and-copy.sh will merge that PR, then apply the local fused-kernel FP8 KV
# source patch before building. Runtime still defaults to BF16 KV for safety;
# override kv_cache_dtype only when testing the patched FP8 path.
# MSA requires --block-size 128. Remove --language-model-only only if you need vision/video.

recipe_version: "1"
name: MiniMax-M3-4bit-W4A16-v0
description: Experimental vLLM serving for bullerwins/MiniMax-M3-4bit-W4A16-v0 on dual Spark TP2; text-only low-memory defaults

# HuggingFace model to download/copy during --setup. If already present in the HF cache,
# hf-download will reuse the local snapshot.
model: bullerwins/MiniMax-M3-4bit-W4A16-v0

# Use a dedicated image tag so an existing generic vllm-node image is not reused
# without the MiniMax-M3 support PR.
container: vllm-node-minimax-m3

build_args:
  # Pin to the known-good vLLM commit that already contains MiniMax-M3 support
  # (PR #45381, merged) and against which the FP8-KV patch applies cleanly.
  # This is the exact vLLM the validated image was built from.
  - --vllm-ref
  - 979b56a66c969ab67655d2155ab4c6c5bed15f65
  - --apply-vllm-patch
  - minimax-m3-fused-fp8-kv.patch
  # Build the Rust PyO3 tool-parser extension so --tool-call-parser minimax_m3 works.
  - --build-rust

cluster_only: true
mods:
  - mods/fix-minimax-m3-autoround-embedding
  - mods/fix-prometheus-fastapi-routing
  # Reasoning-parser robustness: a dropped </mm:think> closer (sampling variance
  # while thinking) otherwise dumps the whole answer into reasoning_content with
  # empty content (tool-eval-bench Structured Output TC-65/66/67/69). Recovers it.
  - mods/fix-minimax-m3-reasoning-parser-robustness
  # FP8 KV scaled-read (step 1/3): adds k_scale/v_scale to the sparse Triton
  # attention kernels so dequantized K/V are scaled on load (stops e4m3 outlier
  # clamping at +-448 -- the likely cause of the fp8-KV quality gap). SAFE NO-OP:
  # scales default to 1.0 (== today) until the write side divides by the same
  # scale (step 2) AND layer._k_scale_float/_v_scale_float are populated (step 3).
  - mods/fix-minimax-m3-fp8-kv-scales-read
  # FP8 KV scaled-write (step 2/3): on the fp8 path, run the fused CUDA insert in
  # norm+rope-only mode and write K/V via reshape_and_cache_flash (divides by
  # _k_scale/_v_scale before the e4m3 cast), mirroring the AMD path. Pairs with
  # the read mod. SAFE NO-OP at default scale 1.0; real scales set in step 3
  # (HBM calibration). BF16-KV path is untouched (self._fp8_kv is False).
  - mods/fix-minimax-m3-fp8-kv-scales-write
  # Indexer FP8 side-cache UNLOCK + scaled-read (1/2): the lightning-indexer's
  # index-K side cache is ~32% of per-rank KV (key-only, single head, replicated
  # across ranks over 57 sparse layers). fp8_e4m3 halves it (14.25->7.13 KiB/tok/
  # rank) => ~+19% context. Safe to quantize: index_k is post-RMSNorm+RoPE
  # (bounded) and is only scored -> top-k block SELECTION (score discarded), and
  # top-k is scale-invariant. Unlocks indexer_kv_dtype=fp8 + dequant-on-load in
  # both score kernels; reads ik_scale_float (default VLLM_M3_FP8_KV_TEST_SCALE,
  # else 1.0). NO-OP unless --attention-config sets indexer_kv_dtype=fp8 below.
  # GATED on the NIAH recall harness (tools/indexer_recall/niah.py) before trust.
  - mods/fix-minimax-m3-indexer-fp8-read
  # Indexer FP8 side-cache scaled-write (2/2): divides index_key by the same
  # per-layer ik_scale_float before the e4m3 cast in _insert_kv, so write(/s) and
  # read(*s) round-trip exactly. Pairs with the read mod. NO-OP unless the index
  # cache is fp8. Real per-layer scales (max_abs/448) come from HBM calibration
  # step 3; until then the uniform test scale validates the path end-to-end.
  - mods/fix-minimax-m3-indexer-fp8-write
  # Localization instrumentation: logs per-layer residual-stream stats for the
  # first few small (real-request) forwards on every TP rank. No-op unless
  # VLLM_M3_DEBUG_ACT=1 is set in env below. Remove once root cause is found.
  - mods/debug-minimax-m3-activations

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.93
  max_model_len: 114688
  max_num_batched_tokens: 2048
  max_num_seqs: 1
  block_size: 128
  kv_cache_dtype: fp8_e4m3
  attention_backend: TRITON_ATTN
  load_format: instanttensor

env:
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"
  # Per-layer activation localization trace (debug-minimax-m3-activations mod).
  # Root cause found (symmetric int4 zero-point double-apply); keep off for benchmarks.
  VLLM_M3_DEBUG_ACT: "0"
  # FP8 KV scale validation (temporary): uniform test scale on ALL layers. Write
  # divides by it, read multiplies by it -> exact round-trip, so COHERENT output
  # proves the scaled fp8 serving path is wired correctly. Set to 2.0 to exercise
  # a non-unit scale. Remove (or set 1.0) for normal serving; step 3 replaces it
  # with per-layer calibrated scales. NOTE: the indexer fp8 read mod ALSO reads
  # this var for its default ik_scale_float, so the same round-trip check covers
  # the indexer side cache (write/2, read*2 -> coherent output + NIAH gate pass).
  VLLM_M3_FP8_KV_TEST_SCALE: "2.0"

command: |
  vllm serve bullerwins/MiniMax-M3-4bit-W4A16-v0 \
      --trust-remote-code \
      --port {port} \
      --host {host} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      -tp {tensor_parallel} \
      --distributed-executor-backend mp \
      --block-size {block_size} \
      --kv-cache-dtype {kv_cache_dtype} \
      --attention-backend {attention_backend} \
      --attention-config '{{"indexer_kv_dtype": "fp8"}}' \
      --compilation-config '{{"mode": 0, "cudagraph_mode": "FULL_DECODE_ONLY"}}' \
      --default-chat-template-kwargs '{{"thinking_mode":"enabled"}}' \
      --max-model-len {max_model_len} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --max-num-seqs {max_num_seqs} \
      --language-model-only \
      --load-format {load_format} \
      --reasoning-parser minimax_m3 \
      --enable-auto-tool-choice \
      --tool-call-parser minimax_m3
