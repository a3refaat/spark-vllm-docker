# Recipe: MiniMax-M3-W4A16 (GPTQ) + EAGLE3 speculative decoding  [STAGE 1: fp8 KV]
#
# Target  : Sebesky/MiniMax-M3-W4A16-GPTQ  (validated fp8-KV stack, ~24.5 t/s base)
# Drafter : Sebesky/MiniMax-M3-EAGLE-W4A16 (1-layer LlamaForCausalLMEagle3, ~3.3B,
#           compressed-tensors pack-quantized W4A16 core linears + W8A16 embed;
#           shares the TARGET's embed_tokens + lm_head via eagle3_shared_target_*).
#
# This is STAGE 1 of the EAGLE3 integration: prove the speculative wiring on the
# *fp8* KV stack first, because the draft is plain-Llama attention and CANNOT use
# the nvfp4 KV path (that path is M3-sparse-only; turnkey nvfp4 dense attention is
# SM100-gated on GB10). fp8 KV works for BOTH the M3 sparse target and the draft.
# STAGE 2 (separate recipe) flips the target to nvfp4 with fp8 draft KV.
#
# DRAFTER IS SLIMMED + CACHE-ONLY: the original drafter (4.1GB) bundles its own
# embed_tokens (1.2GB) + lm_head (2.5GB), but EAGLE3 SHARES those from the target.
# We stripped them -> eagle-w4a16-slim (0.4GB, ~0.2GB/rank). vLLM detects
# has_own_embed_tokens/has_own_lm_head = False and shares the target's by
# reference (no load spike, no CPU-side torch.equal compare). The drafter was
# quantized on the int4 GPTQ target's activations/q_error, so its embed/lm_head
# provenance matches this target exactly. Slim dir is under the mounted HF cache
# on BOTH nodes (host ~/.cache/huggingface -> /root/.cache/huggingface).
#
# vLLM EAGLE3: method MUST be "eagle3"; the draft uses draft_tensor_parallel_size
# (matches the TP-sharded shared embed/lm_head), NOT tensor_parallel_size.

recipe_version: "1"
name: MiniMax-M3-W4A16-GPTQ-EAGLE3
description: MiniMax-M3 GPTQ W4A16 + EAGLE3 (W4A16 drafter) speculative decoding on dual Spark/GB10 TP2; fp8 KV

model: Sebesky/MiniMax-M3-W4A16-GPTQ
container: vllm-node-minimax-m3

build_args:
  - --vllm-ref
  - 979b56a66c969ab67655d2155ab4c6c5bed15f65
  - --apply-vllm-patch
  - minimax-m3-fused-fp8-kv.patch
  - --build-rust

cluster_only: true
# Same fp8 main-KV + fp8-indexer mod stack as minimax-m3-w4a16-gptq.yaml. The mods
# patch the M3 sparse-attention/indexer source by text anchor; the draft model is a
# separate Llama (untouched by these mods).
mods:
  - mods/fix-prometheus-fastapi-routing
  - mods/fix-minimax-m3-reasoning-parser-robustness
  - mods/fix-minimax-m3-fp8-kv-scales-read
  - mods/fix-minimax-m3-fp8-kv-scales-write
  - mods/fix-minimax-m3-indexer-fp8-read
  - mods/fix-minimax-m3-indexer-fp8-write
  - mods/fix-minimax-m3-compressed-tensors-swiglu-clamp
  - mods/fix-minimax-m3-indexer-proj-bf16-load
  - mods/fix-eagle3-draft-embed-quant
  - mods/debug-minimax-m3-eagle3

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  draft_tensor_parallel: 2
  spec_tokens: 3
  # SAFETY (GB10 unified memory): an OOM crashes the whole box. The drafter adds
  # ~3.9GB load-time spike on top of target weights+KV. Start conservative
  # (~22GB/node headroom) and raise only after a clean, watchdog-monitored launch.
  gpu_memory_utilization: 0.92
  max_model_len: 32768
  max_num_batched_tokens: 2048
  max_num_seqs: 1
  block_size: 128
  kv_cache_dtype: fp8_e4m3
  attention_backend: TRITON_ATTN
  load_format: instanttensor

env:
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"
  OMP_NUM_THREADS: "20"
  MKL_NUM_THREADS: "20"
  OPENBLAS_NUM_THREADS: "20"
  NUMEXPR_NUM_THREADS: "20"
  VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
  # EAGLE3 draft instrumentation (debug-minimax-m3-eagle3 mod); logs first 12 steps.
  VLLM_M3_EAGLE_DBG: "0"
  VLLM_M3_EAGLE_DBG_STEPS: "12"
  HF_TOKEN: $HF_TOKEN
  VLLM_M3_FP8_KV_TEST_SCALE: "2.0"

command: |
  vllm serve Sebesky/MiniMax-M3-W4A16-GPTQ \
      --trust-remote-code \
      --port {port} \
      --host {host} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      -tp {tensor_parallel} \
      --distributed-executor-backend mp \
      --block-size {block_size} \
      --kv-cache-dtype {kv_cache_dtype} \
      --attention-backend {attention_backend} \
      --attention-config '{{"indexer_kv_dtype": "fp8"}}' \
      --compilation-config '{{"mode": 0, "cudagraph_mode": "FULL_DECODE_ONLY", "cudagraph_copy_inputs": true}}' \
      --default-chat-template-kwargs '{{"thinking_mode":"enabled"}}' \
      --max-model-len {max_model_len} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --max-num-seqs {max_num_seqs} \
      --language-model-only \
      --load-format {load_format} \
      --speculative-config '{{"method":"eagle3","model":"/root/.cache/huggingface/hub/eagle-bf16-rtn-int4","draft_tensor_parallel_size":{draft_tensor_parallel},"num_speculative_tokens":{spec_tokens},"attention_backend":"TRITON_ATTN"}}' \
      --reasoning-parser minimax_m3 \
      --enable-auto-tool-choice \
      --tool-call-parser minimax_m3
