# Recipe: MiniMax-M3-W4A16-GPTQ + b12x nvfp4 + EAGLE3 — Nsight Systems profiling
#
# Profiling variant of minimax-m3-w4a16-gptq-b12x-nvfp4-eagle3.yaml. Wraps vLLM
# in nsys with a cudaProfilerApi capture range so a single STEADY-STATE SPEC
# window (draft x3 + q_len=4 target verify + rejection) can be bracketed with
# /start_profile + /stop_profile and the per-kernel GPU time broken down to
# answer: within one spec iteration, how much time is the TARGET VERIFY (b12x
# MSA native verify + nvfp4 indexer verify + Marlin MoE + NCCL) vs the DRAFT
# (eagle_* bookkeeping, draft Llama GEMMs, draft b12x attn, rejection, draft KV
# write). This is the evidence base for "why is a spec iteration ~2x a decode".
#
# IMPORTANT: keeps the SAME compiled config as the live eagle3 recipe
# (mode=VLLM_COMPILE, cudagraph_mode=FULL_AND_PIECEWISE) so the trace reflects
# the real serving path (target verify = FULL decode graph; draft = PIECEWISE).
# --cuda-graph-trace=node is REQUIRED to see per-kernel time inside the replayed
# FULL decode (verify) graph.
#
# IMAGE: vllm-node-minimax-m3-b12x-nsys (Dockerfile.b12x-nsys = b12x image +
# nsys 2026.1.3, arm64/sbsa). Build + distribute:
#   docker build -f Dockerfile.b12x-nsys -t vllm-node-minimax-m3-b12x-nsys vendor
#   ./build-and-copy.sh --no-build -c <worker> -t vllm-node-minimax-m3-b12x-nsys --copy-parallel
#
# Profile procedure (after the server is healthy):
#   1. warm: send a few short requests (JIT/autotune/compile settle)
#   2. tools/run_m3_eagle3_nsys_profile.sh vllm_node <ctx> <out>   (drives
#      /start_profile -> one steady spec-decode request -> /stop_profile)
#   3. ./launch-cluster.sh stop        (flush nsys .nsys-rep on both nodes)
#   4. tools/collect_dsv4_nsys_profiles.sh ~/.cache/vllm/profiles/m3-eagle3-nsys \
#        runs/nsys-m3-eagle3/<ts>
#
# nsys output goes to the HOST-mounted vLLM cache (/root/.cache/vllm ->
# ~/.cache/vllm) so reports survive a container stop.

recipe_version: "1"
name: MiniMax-M3-W4A16-GPTQ-b12x-nvfp4-eagle3-nsys
description: Nsight Systems profiling of the b12x nvfp4 EAGLE3 spec-decode path (draft vs q_len=4 verify) on dual GB10 TP2

model: Sebesky/MiniMax-M3-W4A16-GPTQ
container: vllm-node-minimax-m3-b12x-nsys

build_args:
  - --vllm-ref
  - 979b56a66c969ab67655d2155ab4c6c5bed15f65
  - --apply-vllm-patch
  - minimax-m3-fused-fp8-kv.patch
  - --build-rust

cluster_only: true
mods:
  # Consolidated full b12x stack plus EAGLE3 draft-model fixes.
  # run-recipe.py expands the group before invoking launch-cluster.sh.
  - mods/minimax-m3-gptq-b12x-eagle3

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  draft_tensor_parallel: 2
  spec_tokens: 3
  # Lowered vs the live recipe: nsys + spawn workers + inductor compile add
  # memory pressure, and profiling only needs a moderate context window.
  gpu_memory_utilization: 0.90
  max_model_len: 32768
  max_num_batched_tokens: 2048
  max_num_seqs: 1
  block_size: 128
  kv_cache_dtype: nvfp4
  attention_backend: b12x
  load_format: instanttensor
  profile_dir: /root/.cache/vllm/profiles/m3-eagle3-nsys

env:
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"
  OMP_NUM_THREADS: "20"
  MKL_NUM_THREADS: "20"
  OPENBLAS_NUM_THREADS: "20"
  NUMEXPR_NUM_THREADS: "20"
  VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
  HF_TOKEN: $HF_TOKEN
  VLLM_M3_FP8_KV_TEST_SCALE: "1.0"
  # profiling-friendly (per vLLM profiling docs when using Nsight with workers)
  VLLM_WORKER_MULTIPROC_METHOD: spawn
  VLLM_RPC_TIMEOUT: "1800000"
  VLLM_LOG_STATS_INTERVAL: "1"

command: |
  mkdir -p {profile_dir} && \
  nsys profile \
      --force-overwrite=true \
      --trace-fork-before-exec=true \
      --cuda-graph-trace=node \
      --trace=cuda,nvtx \
      --sample=none \
      --cpuctxsw=none \
      --capture-range=cudaProfilerApi \
      --capture-range-end=stop \
      --output {profile_dir}/m3-eagle3-$(hostname)-$$ \
      vllm serve Sebesky/MiniMax-M3-W4A16-GPTQ \
      --trust-remote-code \
      --port {port} \
      --host {host} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      -tp {tensor_parallel} \
      --distributed-executor-backend mp \
      --block-size {block_size} \
      --kv-cache-dtype {kv_cache_dtype} \
      --attention-backend {attention_backend} \
      --attention-config '{{"indexer_kv_dtype": "nvfp4"}}' \
      --compilation-config '{{"mode": 3, "cudagraph_mode": "FULL_AND_PIECEWISE", "cudagraph_copy_inputs": true}}' \
      --speculative-config '{{"method":"eagle3","model":"/root/.cache/huggingface/hub/eagle-bf16-rtn-int4","draft_tensor_parallel_size":{draft_tensor_parallel},"num_speculative_tokens":{spec_tokens},"attention_backend":"b12x"}}' \
      --default-chat-template-kwargs '{{"thinking_mode":"enabled"}}' \
      --max-model-len {max_model_len} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --max-num-seqs {max_num_seqs} \
      --language-model-only \
      --load-format {load_format} \
      --reasoning-parser minimax_m3 \
      --enable-auto-tool-choice \
      --tool-call-parser minimax_m3 \
      --profiler-config '{{"profiler":"cuda"}}'
