# Recipe: MiniMax-M3-W4A16-GPTQ + b12x CuTe MSA — Nsight Systems profiling
#
# Profiling variant of minimax-m3-w4a16-gptq-b12x.yaml. Wraps vLLM in nsys with
# CUDA profiler-API capture range so a single STEADY-STATE DECODE window can be
# bracketed with /start_profile + /stop_profile and the per-kernel GPU time
# broken down (Marlin int4 MoE GEMMs vs b12x CuTe MSA attention vs M3 Triton
# indexer vs NCCL TP all-reduce vs norms/quant). This is the evidence base for
# "where does decode time actually go" on the 2xGB10 cluster.
#
# IMAGE: vllm-node-minimax-m3-b12x-nsys (Dockerfile.b12x-nsys = b12x image +
# nsys 2026.1.3, arm64/sbsa). Build + distribute:
#   docker build -f Dockerfile.b12x-nsys -t vllm-node-minimax-m3-b12x-nsys vendor
#   ./build-and-copy.sh --no-build -c <worker> -t vllm-node-minimax-m3-b12x-nsys
#
# Profile procedure (after 'Started server process'):
#   1. warm: send a few short requests (JIT/autotune settle)
#   2. POST /start_profile   (cudaProfilerStart -> nsys begins capture, all ranks)
#   3. send ONE steady decode request (fixed ctx, ~100-200 tokens)
#   4. POST /stop_profile    (cudaProfilerStop -> nsys finalizes report)
#   5. nsys stats --report cuda_gpu_kern_sum /workspace/nsys/m3b12x-<host>-<pid>.nsys-rep
#
# The debug-activations mod is DROPPED here (its per-layer rms/max .item() host
# syncs would pollute the trace). cudagraph FULL_DECODE_ONLY is kept; nsys
# --cuda-graph-trace=node is REQUIRED to see per-kernel time inside the replayed
# decode graph.

recipe_version: "1"
name: MiniMax-M3-W4A16-GPTQ-b12x-nsys
description: Nsight Systems profiling of the b12x MSA decode path on dual GB10 TP2

model: Sebesky/MiniMax-M3-W4A16-GPTQ
container: vllm-node-minimax-m3-b12x-nsys

build_args:
  - --vllm-ref
  - 979b56a66c969ab67655d2155ab4c6c5bed15f65
  - --apply-vllm-patch
  - minimax-m3-fused-fp8-kv.patch
  - --build-rust

cluster_only: true
mods:
  # Consolidated profiling-only stack: legacy fp8 vLLM indexer/KV patches
  # plus b12x sparse MSA main attention; dense stays on TRITON_ATTN.
  - mods/minimax-m3-gptq-b12x-msa-profile

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.90
  max_model_len: 16384
  max_num_batched_tokens: 2048
  max_num_seqs: 1
  block_size: 128
  kv_cache_dtype: fp8_e4m3
  attention_backend: TRITON_ATTN
  load_format: instanttensor

env:
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"
  OMP_NUM_THREADS: "20"
  MKL_NUM_THREADS: "20"
  OPENBLAS_NUM_THREADS: "20"
  NUMEXPR_NUM_THREADS: "20"
  VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
  HF_TOKEN: $HF_TOKEN
  VLLM_M3_FP8_KV_TEST_SCALE: "2.0"
  # profiling-friendly
  VLLM_WORKER_MULTIPROC_METHOD: spawn
  VLLM_RPC_TIMEOUT: "1800000"
  VLLM_LOG_STATS_INTERVAL: "1"

command: |
  mkdir -p /workspace/nsys && \
  nsys profile \
      --force-overwrite=true \
      --trace-fork-before-exec=true \
      --cuda-graph-trace=node \
      --trace=cuda,nvtx \
      --sample=none \
      --cpuctxsw=none \
      --capture-range=cudaProfilerApi \
      --capture-range-end=stop \
      --output /workspace/nsys/m3b12x-$(hostname)-$$ \
      vllm serve Sebesky/MiniMax-M3-W4A16-GPTQ \
      --trust-remote-code \
      --port {port} \
      --host {host} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      -tp {tensor_parallel} \
      --distributed-executor-backend mp \
      --block-size {block_size} \
      --kv-cache-dtype {kv_cache_dtype} \
      --attention-backend {attention_backend} \
      --attention-config '{{"indexer_kv_dtype": "fp8"}}' \
      --compilation-config '{{"mode": 0, "cudagraph_mode": "FULL_DECODE_ONLY", "cudagraph_copy_inputs": true}}' \
      --default-chat-template-kwargs '{{"thinking_mode":"enabled"}}' \
      --max-model-len {max_model_len} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --max-num-seqs {max_num_seqs} \
      --language-model-only \
      --load-format {load_format} \
      --reasoning-parser minimax_m3 \
      --enable-auto-tool-choice \
      --tool-call-parser minimax_m3 \
      --profiler-config '{{"profiler":"cuda"}}'
